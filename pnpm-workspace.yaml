# The CMS. The site (web/) is its own install root, so Cloudflare's build
# installs only what the site needs.
packages:
    - cms
minimumReleaseAge: 2880 # 2 days
# Next 16.4.2, React 19.3.1 and Payload 3.91.0 were taken early (published
# 2026-10-14/15); drop these once they're past the window.
minimumReleaseAgeExclude:
    - next
    - '@next/*'
    - eslint-config-next
    - react
    - react-dom
    - payload
    - '@payloadcms/*'
allowBuilds:
    esbuild: true
    sharp: true
    unrs-resolver: true
